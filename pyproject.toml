[project]
name = "open-fdx-parser"
version = "0.1.0"
description = "Zero-dependency Final Draft (.fdx) screenplay parser — FDX XML to structured Python dataclasses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Stephen Fingleton" }]
keywords = ["screenplay", "fdx", "final-draft", "parser", "film", "pre-production"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["fdx_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
